<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — BlueSpot Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3a;
      --blue:     #4fa3e8;
      --blue-dim: #3a8ccf;
      --text:     #f0f2f8;
      --muted:    #8b90a8;
      --green:    #4caf82;
      --red:      #e85f5f;
      --input-bg: #12151f;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--blue);
      letter-spacing: -0.4px;
      margin-bottom: 28px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field { margin-bottom: 18px; }

    input[type="password"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="password"]:focus { border-color: var(--blue); }

    .strength-bar {
      height: 4px;
      border-radius: 4px;
      margin-top: 8px;
      background: var(--border);
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 4px;
      width: 0;
      transition: width .25s, background .25s;
    }

    button {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s, opacity .15s;
    }
    button:hover:not(:disabled) { background: var(--blue-dim); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .msg {
      font-size: 13px;
      line-height: 1.5;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .msg.show { display: block; }
    .msg.error { background: rgba(232,95,95,.12); color: var(--red); border: 1px solid rgba(232,95,95,.25); }
    .msg.success { background: rgba(76,175,130,.12); color: var(--green); border: 1px solid rgba(76,175,130,.25); }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link span { color: var(--blue); font-weight: 600; }

    /* expired / invalid token state */
    .state-invalid { display: none; }
    .state-invalid.show { display: block; }
    .state-form.hide { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">BlueSpot Hub</div>

  <!-- shown when token is missing / expired -->
  <div class="state-invalid" id="stateInvalid">
    <div class="msg error show" id="tokenErr">Checking link…</div>
    <a class="back-link" href="adminpanel.html">← <span>Back to sign in</span></a>
  </div>

  <!-- the actual form -->
  <div class="state-form" id="stateForm">
    <h1>Set a new password</h1>
    <p class="subtitle">Choose a strong password for your BlueSpot Hub account.</p>

    <div class="msg" id="formMsg"></div>

    <div class="field">
      <label for="newPass">New password</label>
      <input type="password" id="newPass" placeholder="At least 6 characters" autocomplete="new-password" />
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    </div>

    <div class="field">
      <label for="confirmPass">Confirm password</label>
      <input type="password" id="confirmPass" placeholder="Repeat your new password" autocomplete="new-password" />
    </div>

    <button id="submitBtn" onclick="doReset()">Reset Password</button>
    <a class="back-link" href="adminpanel.html">← <span>Back to sign in</span></a>
  </div>
</div>

<script>
  // ── Config — update this to your deployed worker URL ──────────────────
  const RESET_WORKER_URL = 'https://bluespot-password-reset.christian-51e.workers.dev';

  // ── Read token from URL ────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  const token  = params.get('token');

  if (!token) {
    showInvalid('No reset token found. Please use the link from your email.');
  }

  // ── Password strength meter ────────────────────────────────────────────
  document.getElementById('newPass').addEventListener('input', function () {
    const v = this.value;
    let score = 0;
    if (v.length >= 6)  score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;

    const fill   = document.getElementById('strengthFill');
    const colors = ['#e85f5f', '#e89a5f', '#e8c85f', '#4caf82', '#4fa3e8'];
    fill.style.width      = `${(score / 5) * 100}%`;
    fill.style.background = colors[Math.max(0, score - 1)] || colors[0];
  });

  // ── Submit ─────────────────────────────────────────────────────────────
  async function doReset() {
    const password = document.getElementById('newPass').value;
    const confirm  = document.getElementById('confirmPass').value;
    const btn      = document.getElementById('submitBtn');
    const msg      = document.getElementById('formMsg');

    msg.className = 'msg';
    msg.textContent = '';

    if (!password || password.length < 6) {
      return showFormMsg('error', 'Password must be at least 6 characters.');
    }
    if (password !== confirm) {
      return showFormMsg('error', 'Passwords do not match.');
    }

    btn.disabled = true;
    btn.textContent = 'Resetting…';

    try {
      const res  = await fetch(RESET_WORKER_URL + '/verify-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        throw new Error(data.error || 'Something went wrong. Please try again.');
      }

      showFormMsg('success', '✓ Password updated! Redirecting to sign in…');
      document.getElementById('newPass').value    = '';
      document.getElementById('confirmPass').value = '';
      setTimeout(() => { location.href = 'adminpanel.html'; }, 2500);
    } catch (err) {
      showFormMsg('error', err.message);
      btn.disabled    = false;
      btn.textContent = 'Reset Password';
    }
  }

  function showFormMsg(type, text) {
    const el = document.getElementById('formMsg');
    el.className   = `msg ${type} show`;
    el.textContent = text;
  }

  function showInvalid(text) {
    document.getElementById('stateForm').classList.add('hide');
    document.getElementById('stateInvalid').classList.add('show');
    document.getElementById('tokenErr').textContent = text;
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && token) doReset();
  });
</script>
</body>
</html>
